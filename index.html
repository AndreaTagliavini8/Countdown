<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Mezzanotte Lab</title>
<meta name="description" content="La nostra collezione sta arrivando. Rimanete connessi.">
<meta property="og:type" content="website">
<meta property="og:title" content="Mezzanotte Lab">
<meta property="og:description" content="La nostra collezione sta arrivando. Rimanete connessi.">
<meta property="og:url" content="https://andreatagliavini8.github.io/Countdown/">
<meta property="og:image" content="https://andreatagliavini8.github.io/Countdown/logo.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap">
<style>
:root{--ink:#fff;--mute:rgba(255,255,255,.68);--line:rgba(255,255,255,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#05041a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(100deg,#27258f 0%,#15125c 38%,#06051c 72%,#000 100%) fixed;text-align:center}
#bgv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
#bgv.on{opacity:1}
#tint{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(100deg,rgba(39,37,143,.35),rgba(6,5,28,.55) 60%,rgba(0,0,0,.7))}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
#sky i{position:absolute;background:#fff;border-radius:50%;opacity:.15;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.95}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:44px 18px 64px}
#logo{width:84px;height:84px;border-radius:50%;display:block;margin:0 auto 14px;box-shadow:0 0 0 1px var(--line)}
.brand{margin:0;font-weight:400;letter-spacing:.32em;font-size:.85rem;text-transform:uppercase;color:var(--mute)}
.cd{display:flex;justify-content:center;align-items:flex-start;gap:clamp(6px,2.5vw,22px);margin:46px 0 34px}
.u{min-width:0;flex:0 1 auto}
.u b{display:block;font-weight:300;font-size:clamp(2.3rem,12vw,5rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.u span{display:block;margin-top:10px;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.sep{display:flex;flex-direction:column;gap:clamp(8px,3vw,20px);padding-top:clamp(.6rem,3.5vw,1.6rem)}
.sep svg{width:clamp(7px,2.4vw,14px);height:clamp(7px,2.4vw,14px);fill:#fff}
#fine{font-weight:300;font-size:2.4rem;margin:46px 0 34px}
.msg{margin:0;font-size:clamp(1.05rem,4.2vw,1.4rem);font-weight:300;line-height:1.5}
.when{margin:14px 0 0;font-size:.82rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:54px}
figure{margin:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.05);opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s ease}
figure.in{opacity:1;transform:none}
.ph{position:relative;aspect-ratio:4/5;background:#0d0b3a;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease,filter 1.6s ease,transform 1.6s ease}
.ph img.on{opacity:1}
.zoom{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.45);color:#fff;font-size:16px;line-height:1;cursor:pointer;padding:0}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots i.on{background:#fff}
.g.locked .ph{cursor:default}
.g.locked .ph img{filter:blur(18px) brightness(.55);transform:scale(1.12)}
.g.locked .zoom,.g.locked .dots{display:none}
.g.locked .ph::after{content:"Presto";position:absolute;inset:0;display:grid;place-items:center;font-size:.8rem;letter-spacing:.35em;text-transform:uppercase}
figcaption{padding:12px 14px;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.ig{display:inline-block;margin-top:40px;padding:14px 26px;border:1px solid rgba(255,255,255,.4);border-radius:999px;color:#fff;text-decoration:none;letter-spacing:.18em;text-transform:uppercase;font-size:.78rem}
#lb{position:fixed;inset:0;z-index:10;background:rgba(2,1,20,.95);display:flex;align-items:center;justify-content:center}
#lb img{max-width:92vw;max-height:84vh;object-fit:contain;border-radius:10px}
#lb button{position:absolute;background:none;border:0;color:#fff;font-size:34px;cursor:pointer;padding:14px}
#lb .x{top:calc(env(safe-area-inset-top,0px) + 6px);right:8px}
#lb .p{left:2px;top:50%}
#lb .n{right:2px;top:50%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<noscript><style>figure{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body>
<video id="bgv" src="sfondo.mp4" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
<div id="tint"></div>
<div id="sky"></div>
<main>
<img id="logo" src="logo.png" alt="Mezzanotte Lab">
<p class="brand">mezzanottelab</p>
<div class="cd" id="cd">
<div class="u"><b id="d">00</b><span>giorni</span></div>
<div class="sep"><i class="st"></i><i class="st"></i></div>
<div class="u"><b id="h">00</b><span>ore</span></div>
<div class="sep"><i class="st"></i><i class="st"></i></div>
<div class="u"><b id="m">00</b><span>minuti</span></div>
<div class="sep"><i class="st"></i><i class="st"></i></div>
<div class="u"><b id="s">00</b><span>secondi</span></div>
</div>
<p id="fine" hidden>È il momento.</p>
<p class="msg" id="msg">La nostra collezione sta arrivando.<br>Rimanete connessi.</p>
<p class="when">31 ottobre · 15:15</p>
<section class="g" id="g"></section>
<a class="ig" id="ig" href="https://www.instagram.com/mezzanottelab/" target="_blank" rel="noopener">Seguici su Instagram</a>
</main>
<div id="lb" hidden><button class="x" aria-label="Chiudi">✕</button><button class="p" aria-label="Precedente">‹</button><img alt=""><button class="n" aria-label="Successiva">›</button></div>
<script>
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var STAR='<svg viewBox="0 0 10 10"><path d="M5 0Q5.6 4.4 10 5Q5.6 5.6 5 10Q4.4 5.6 0 5Q4.4 4.4 5 0Z"/></svg>';
Array.prototype.forEach.call(document.querySelectorAll(".st"),function(e){e.innerHTML=STAR;e.style.display="block"});
var sky=document.getElementById("sky");
for(var q=0;q<70;q++){var st=document.createElement("i"),z=Math.random()*2+1;st.style.cssText="left:"+Math.random()*100+"%;top:"+Math.random()*100+"%;width:"+z+"px;height:"+z+"px;animation-duration:"+(2+Math.random()*5)+"s;animation-delay:-"+Math.random()*6+"s";sky.appendChild(st)}
function uri(s){return "data:image/svg+xml,"+encodeURIComponent(s)}
var SP='<path d="M50 14.5C50.6 22 50.8 26 55 28.5L45 28.5C49.2 26 49.4 22 50 14.5Z"/>';
var LOGO=uri('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#000"/><g fill="#fff"><circle cx="50" cy="50" r="23"/>'+SP+'<g transform="translate(0,100) scale(1,-1)">'+SP+'</g></g><ellipse cx="50" cy="50" rx="16" ry="22" fill="#000"/><g fill="#fff"><rect x="49.4" y="28" width="1.2" height="17"/><rect x="49.4" y="55" width="1.2" height="17"/></g></svg>');
var P={shirt:"M70 40 L30 65 L45 110 L65 100 L65 230 L135 230 L135 100 L155 110 L170 65 L130 40 Q100 65 70 40Z",pants:"M60 40 H140 L152 230 H108 L100 100 L92 230 H48 Z"};
function ph(k,v){return uri('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250"><rect width="200" height="250" fill="'+(v?'#171458':'#100e48')+'"/><path d="'+P[k]+'" fill="#ffffff" fill-opacity="'+(v?'.34':'.22')+'"/><text x="100" y="244" text-anchor="middle" fill="#fff" fill-opacity=".5" font-family="sans-serif" font-size="9">'+(v?'retro':'fronte')+'</text></svg>')}
function fb(i,u){i.onerror=function(){i.onerror=null;i.src=u};if(i.complete&&i.naturalWidth===0)i.onerror()}
fb(document.getElementById("logo"),LOGO);
var target=new Date("2026-10-31T15:15:00+01:00").getTime();
var preview=/anteprima/.test(location.search);
var locked=false;
var g=document.getElementById("g");
var items=[["maglietta-1","shirt","Maglietta"],["pantaloni-1","pants","Pantaloni"],["maglietta-2","shirt","Maglietta"],["pantaloni-2","pants","Pantaloni"]];
var all=[],io=window.IntersectionObserver?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.12}):null;
items.forEach(function(it,n){
var f=document.createElement("figure"),lab=it[2]+" "+(Math.floor(n/2)+1);
f.innerHTML='<div class="ph"><img class="on" src="'+it[0]+'.jpg" alt="'+lab+' fronte"><img src="'+it[0]+'-retro.jpg" alt="'+lab+' retro"><button class="zoom" type="button" aria-label="Ingrandisci">⤢</button><span class="dots"><i class="on"></i><i></i></span></div><figcaption>'+it[2]+'</figcaption>';
g.appendChild(f);
var im=f.querySelectorAll("img"),dt=f.querySelectorAll(".dots i");
fb(im[0],ph(it[1],0));fb(im[1],ph(it[1],1));
all.push(im[0],im[1]);
var tm=null;
function flip(){var v=im[1].classList.contains("on")?1:0;im[v].classList.remove("on");dt[v].classList.remove("on");im[1-v].classList.add("on");dt[1-v].classList.add("on")}
function auto(){clearInterval(tm);if(reduce)return;tm=setInterval(function(){if(!locked&&lb.hidden&&!document.hidden)flip()},5000)}
setTimeout(auto,n*1200);
f.querySelector(".ph").addEventListener("click",function(e){
if(locked)return;
var v=im[1].classList.contains("on")?1:0;
if(e.target.closest(".zoom")){openLB(n*2+v);return}
flip();auto()});
if(io)io.observe(f);else f.classList.add("in")});
var lb=document.getElementById("lb"),lbi=lb.querySelector("img"),cur=0,tx=0;
function show(i){cur=(i+all.length)%all.length;lbi.src=all[cur].src}
function openLB(i){show(i);lb.hidden=false;document.body.style.overflow="hidden"}
function closeLB(){lb.hidden=true;document.body.style.overflow=""}
lb.querySelector(".x").onclick=closeLB;
lb.querySelector(".p").onclick=function(e){e.stopPropagation();show(cur-1)};
lb.querySelector(".n").onclick=function(e){e.stopPropagation();show(cur+1)};
lb.addEventListener("click",function(e){if(e.target===lb)closeLB()});
lb.addEventListener("touchstart",function(e){tx=e.changedTouches[0].clientX},{passive:true});
lb.addEventListener("touchend",function(e){var d=e.changedTouches[0].clientX-tx;if(d>50)show(cur-1);else if(d<-50)show(cur+1)},{passive:true});
document.addEventListener("keydown",function(e){if(lb.hidden)return;if(e.key==="Escape")closeLB();if(e.key==="ArrowLeft")show(cur-1);if(e.key==="ArrowRight")show(cur+1)});
function unlock(){
locked=false;g.classList.remove("locked");
document.getElementById("cd").hidden=true;document.getElementById("fine").hidden=false;
document.getElementById("msg").innerHTML="La collezione è arrivata.";
document.getElementById("ig").textContent="Scopri tutto su Instagram"}
function p(n){return n<10?"0"+n:""+n}
function put(id,v){var e=document.getElementById(id);if(e.textContent!==v){e.textContent=v;if(e.animate&&!reduce)e.animate([{opacity:.25,transform:"translateY(-8px)"},{opacity:1,transform:"none"}],{duration:280,easing:"ease-out"})}}
function tick(){
var t=target-Date.now();
if(t<=0){unlock();return}
var s=Math.floor(t/1000);
put("d",p(Math.floor(s/86400)));put("h",p(Math.floor(s%86400/3600)));put("m",p(Math.floor(s%3600/60)));put("s",p(s%60));
setTimeout(tick,1000)}
if(!locked&&Date.now()<target){g.classList.remove("locked")}
tick();
var bv=document.getElementById("bgv");
if(reduce){bv.remove()}else{bv.addEventListener("playing",function(){bv.classList.add("on")});var pr=bv.play();if(pr&&pr.catch)pr.catch(function(){})}
</script>
</body>
</html>
