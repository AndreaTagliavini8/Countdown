<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manca poco</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&display=swap">
<style>
:root{--bg:#e4eaee;--ink:#1b2733;--mute:#5b6b78;--card:#fff;--tile:#1b2733;--tileink:#fff;--acc:#ff5a4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151b;--ink:#eef2f5;--mute:#93a3b0;--card:#18212a;--tile:#eef2f5;--tileink:#0f151b}}
:root[data-theme="dark"]{--bg:#0f151b;--ink:#eef2f5;--mute:#93a3b0;--card:#18212a;--tile:#eef2f5;--tileink:#0f151b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:44px 18px 60px}
header{text-align:center;margin-bottom:26px}
h1{font-size:clamp(2.4rem,11vw,4.6rem);line-height:.95;margin:0;font-weight:800;letter-spacing:-.03em}
.when{margin:12px 0 0;color:var(--mute);font-size:1.05rem}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 46px}
.u{background:var(--tile);color:var(--tileink);border-radius:18px;padding:18px 4px 14px;text-align:center;position:relative}
.u b{display:block;font-size:clamp(2rem,10.5vw,3.8rem);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.u span{display:block;margin-top:8px;font-size:.85rem;opacity:.7}
.u.s{background:var(--acc);color:#fff}
.u.s span{opacity:.9}
#fine{text-align:center;font-size:2rem;font-weight:800;color:var(--acc);margin:0 0 46px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
figure{margin:0;background:var(--card);border-radius:18px;overflow:hidden}
figure img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#cfd8de}
figcaption{padding:12px 14px;font-weight:700}
</style>
</head>
<body>
<main>
<header>
<h1>Manca poco</h1>
<p class="when">Sabato 31 ottobre, ore 15:15</p>
</header>
<div class="cd" id="cd">
<div class="u"><b id="d">0</b><span>giorni</span></div>
<div class="u"><b id="h">00</b><span>ore</span></div>
<div class="u"><b id="m">00</b><span>minuti</span></div>
<div class="u s"><b id="s">00</b><span>secondi</span></div>
</div>
<p id="fine" hidden>È il momento!</p>
<section class="g">
<figure><img src="maglietta-1.jpg" data-k="shirt" alt="Maglietta 1"><figcaption>Maglietta</figcaption></figure>
<figure><img src="pantaloni-1.jpg" data-k="pants" alt="Pantaloni 1"><figcaption>Pantaloni</figcaption></figure>
<figure><img src="maglietta-2.jpg" data-k="shirt" alt="Maglietta 2"><figcaption>Maglietta</figcaption></figure>
<figure><img src="pantaloni-2.jpg" data-k="pants" alt="Pantaloni 2"><figcaption>Pantaloni</figcaption></figure>
</section>
</main>
<script>
var P={shirt:"M70 40 L30 65 L45 110 L65 100 L65 230 L135 230 L135 100 L155 110 L170 65 L130 40 Q100 65 70 40Z",pants:"M60 40 H140 L152 230 H108 L100 100 L92 230 H48 Z"};
function ph(k){var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250"><rect width="200" height="250" fill="#cfd8de"/><path d="'+P[k]+'" fill="#8fa1ae"/></svg>';return "data:image/svg+xml,"+encodeURIComponent(s)}
Array.prototype.forEach.call(document.querySelectorAll("img[data-k]"),function(i){var k=i.getAttribute("data-k");i.onerror=function(){i.onerror=null;i.src=ph(k)}; if(i.complete&&i.naturalWidth===0){i.onerror()}});
var target=new Date("2026-10-31T15:15:00+01:00").getTime();
function p(n){return n<10?"0"+n:""+n}
function tick(){
var t=target-Date.now();
if(t<=0){document.getElementById("cd").hidden=true;document.getElementById("fine").hidden=false;return}
var s=Math.floor(t/1000);
document.getElementById("d").textContent=Math.floor(s/86400);
document.getElementById("h").textContent=p(Math.floor(s%86400/3600));
document.getElementById("m").textContent=p(Math.floor(s%3600/60));
document.getElementById("s").textContent=p(s%60);
setTimeout(tick,1000)}
tick();
</script>
</body>
</html>
